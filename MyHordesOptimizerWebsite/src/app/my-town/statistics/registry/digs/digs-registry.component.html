<div class="digs">
    <div class="header">
        <h2>Jour {{ current_day() }}</h2>
        @if (!is_readonly()) {
            <mat-form-field subscriptSizing="dynamic" (click)="$event.stopPropagation()">
                <mho-select [options]="completeCitizenList() | citizenNotInDigList:digs()" [bindLabel]="'name'" [ngModel]="''"
                            (ngModelChange)="addCitizen($event)" searchable>
                </mho-select>
            </mat-form-field>
        }
    </div>
    <div class="rows">
        @for (dig of digs(); track dig) {
            @if (dig | citizenForDig:completeCitizenList(); as citizen) {
                <mho-dig [dig]="dig" [digsMode]="'registry'" [citizen]="citizen" [day]="dig.day" [readonly]="is_readonly()"></mho-dig>
            }
        }
    </div>
</div>
