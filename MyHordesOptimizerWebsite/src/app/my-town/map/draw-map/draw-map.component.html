@if (complete_map(); as complete_map) {
    <div #mapGrid class="mho-draw-map" role="grid"
         [class.zoom-compact]="zoom_tier() === 'compact'"
         [class.zoom-detail]="zoom_tier() === 'detail'"
         [style.--mho-cell]="cell_size()"
         [style.--mho-map-columns]="columns_template()"
         [attr.aria-rowcount]="drawed_map().length"
         [attr.aria-colcount]="x_row().length">

        <ng-container *ngTemplateOutlet="axisRow; context: {$implicit: true}"></ng-container>

        @for (row of drawed_map(); track row; let row_index = $index) {
            <div class="map-row" role="row">
                <mho-map-border vertical side="left" [myCell]="my_cell()" [hoveredCell]="hovered_cell" [selectedCell]="selected_cell()"
                                [index]="+complete_map.town_y - row_index"></mho-map-border>
                @for (cell of row; track cell.cell_id; let cell_index = $index) {
                    <mho-map-cell [cell]="cell"
                                  [allItems]="allItems()" [allRuins]="allRuins()"
                                  [allCitizens]="allCitizens()" [options]="options()" [drawedMap]="drawed_map()"
                                  [detailed]="zoom_tier() === 'detail'"
                                  [selected]="row_index === selected_row() && cell_index === selected_column()"
                                  [crossed]="row_index === selected_row() || cell_index === selected_column()"
                                  (cellSelected)="selectCell($event, row_index, cell_index)"
                                  (currentHoveredCellChange)="hovered_cell = $event">
                    </mho-map-cell>
                }
                <mho-map-border vertical side="right" [myCell]="my_cell()" [hoveredCell]="hovered_cell" [selectedCell]="selected_cell()"
                                [index]="+complete_map.town_y - row_index"></mho-map-border>
            </div>
        }

        <ng-container *ngTemplateOutlet="axisRow; context: {$implicit: false}"></ng-container>

        @if (selected(); as selected) {
            <mho-map-cell-details [cell]="selected.cell" [cellHtml]="selected.element"
                                  [allRuins]="allRuins()" [allCitizens]="allCitizens()" [allItems]="allItems()"
                                  [canUpdate]="!is_readonly()"
                                  (updateRequested)="openCellUpdate()" (closed)="closeDetail()"></mho-map-cell-details>
        }

        <ng-template #axisRow let-first>
            <div class="map-row axis-row" [class.top]="first" [class.bottom]="!first" role="row">
                <mho-map-border vertical horizontal side="left" [myCell]="my_cell()" [hoveredCell]="hovered_cell"
                                [selectedCell]="selected_cell()"></mho-map-border>
                @for (x of x_row(); track x) {
                    <mho-map-border horizontal [index]="x" [myCell]="my_cell()" [hoveredCell]="hovered_cell"
                                    [selectedCell]="selected_cell()"></mho-map-border>
                }
                <mho-map-border vertical horizontal side="right" [myCell]="my_cell()" [hoveredCell]="hovered_cell"
                                [selectedCell]="selected_cell()"></mho-map-border>
            </div>
        </ng-template>
    </div>
}
