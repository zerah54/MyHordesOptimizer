@if (task(); as task) {
    <div class="task-editor" (click)="onClick($event)" (keydown)="onKeydown($event)">
        <mho-planning-task-fields [kind]="task.kind" [disabled]="!store.can_edit()"
                                  [actionOptions]="actionOptions(task)" [actionRef]="task.ref ?? null" [useOptions]="useOptions(actionMaxUses(task))"
                                  [uses]="task.count ?? 1"
                                  [upgradeAllowed]="upgradeAllowed()" [upgrades]="store.home_upgrades()" [upgradeRef]="task.ref ?? null"
                                  [upgradeLevel]="task.level ?? null"
                                  [homeLevels]="homeLevels(task)" [homeLevel]="task.level ?? null" [label]="task.label ?? ''" [pa]="task.pa"
                                  (kindChange)="setTaskKind($event)" (actionChange)="setTaskAction($event)" (usesChange)="setTaskCount($event ?? 1)"
                                  (upgradeChange)="setTaskUpgrade($event)" (upgradeLevelChange)="onUpgradeLevel($event)" (homeLevelChange)="onHomeLevel($event)"
                                  (labelChange)="onTaskLabel($event)" (paChange)="onTaskPa($event)"/>
        <button mat-icon-button type="button" data-action="remove-task" [disabled]="!store.can_edit()" (click)="removeTask()"
                i18n-matTooltip matTooltip="Supprimer la consigne">
            <mat-icon>delete</mat-icon>
        </button>
    </div>
}
