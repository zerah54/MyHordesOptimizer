<h2 mat-dialog-title i18n>Ajouter une consigne individuelle</h2>
<mat-dialog-content>
    <p class="target">
        <ng-container i18n>Citoyens visés :</ng-container>
        <strong>{{ data.user_ids.length }}</strong></p>
    <mho-planning-task-fields [kind]="kind()" [disabled]="!store.can_edit()"
                              [actionOptions]="action_options()" [actionRef]="action_key()" [useOptions]="use_options()" [uses]="uses()"
                              [usesDefaultLabel]="uses_default_label"
                              [upgradeAllowed]="upgrade_allowed()" [upgrades]="store.home_upgrades()" [upgradeRef]="upgrade_key()" [upgradeLevel]="level()"
                              [homeLevels]="home_levels()" [homeLevel]="level()" [levelDefaultLabel]="level_default_label" [label]="label()" [pa]="pa()"
                              (kindChange)="setKind($event)" (actionChange)="setAction($event)" (usesChange)="uses.set($event)"
                              (upgradeChange)="setUpgrade($event)" (upgradeLevelChange)="level.set($event)" (homeLevelChange)="level.set($event)"
                              (labelChange)="label.set($event)" (paChange)="onPa($event)"/>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close i18n>Annuler</button>
    <button mat-flat-button type="button" data-action="bulk-confirm" [disabled]="!valid()" (click)="confirm()" i18n>Ajouter</button>
</mat-dialog-actions>
