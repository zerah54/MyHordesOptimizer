<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
    <p>
        <mho-day-selector i18n-aria-label aria-label="Jour" [days]="data.days" [value]="day()" [today]="data.today"
                          (valueChange)="day.set($event)"></mho-day-selector>
    </p>
    @if (data.askParts) {
        <p>
            <mat-checkbox data-field="budget" [checked]="budget()" (change)="budget.set($event.checked)" i18n>Budget</mat-checkbox>
            <mat-checkbox data-field="programs" [checked]="programs()" (change)="programs.set($event.checked)" i18n>Programmes</mat-checkbox>
        </p>
    } @else if (data.askName !== false) {
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label i18n>Nom de la proposition</mat-label>
            <input matInput type="text" data-field="name" cdkFocusInitial [maxlength]="max_length" [ngModel]="name()" (ngModelChange)="name.set($event)"
                   (keydown.enter)="confirm()">
        </mat-form-field>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close i18n>Annuler</button>
    <button mat-flat-button type="button" data-action="confirm" [disabled]="invalid()" (click)="confirm()" i18n>Valider</button>
</mat-dialog-actions>
