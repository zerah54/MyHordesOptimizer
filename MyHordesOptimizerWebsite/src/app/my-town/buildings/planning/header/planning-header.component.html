<div class="planning-header">
    <mho-day-selector [days]="store.days()" [value]="store.selected_day()" [today]="store.current_day"
                      (valueChange)="selectDay($event)"></mho-day-selector>

    <div class="plans" role="list">
        @for (plan of store.plans_of_day(); track plan.id) {
            <span class="plan-chip" role="listitem" [class.selected]="isSelected(plan)">
                <button mat-button type="button" data-action="select-plan" (click)="selectPlan(plan.id)">
                    <span class="label">
                        @if (plan.isEffective) {
                            <mat-icon class="effective" i18n-matTooltip matTooltip="Proposition effective du jour">star</mat-icon>
                        }
                        {{ plan.name }}
                    </span>
                </button>
                @if (isSelected(plan) && store.can_edit()) {
                    <button mat-icon-button type="button" data-action="plan-menu" [matMenuTriggerFor]="plan_menu" i18n-matTooltip
                            matTooltip="Actions sur la proposition">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                }
            </span>
        }
        <button mat-stroked-button type="button" data-action="new-plan" [disabled]="!store.can_edit()" (click)="newPlan()">
            <span class="label">
                <mat-icon>add</mat-icon>
                <ng-container i18n>Proposition</ng-container>
            </span>
        </button>
    </div>

    <div class="actions">
        @if (store.draft() !== null) {
            <mat-slide-toggle data-field="manage-banned" [checked]="store.banned_pool_shown()" [disabled]="!store.can_edit() || store.banned_pool_forced()"
                              (change)="onManageBanned($event.checked)" [matTooltipDisabled]="!store.banned_pool_forced()"
                              i18n-matTooltip
                              matTooltip="Toujours active : la ville a un banni ou le Bureau des esclavagistes, ou la proposition a du contenu côté bannis"
                              i18n>Gestion des bannis
            </mat-slide-toggle>
        }
        <button mat-flat-button type="button" data-action="save" [disabled]="!store.can_edit() || !store.dirty() || store.saving()" (click)="store.save()">
            @if (store.saving()) {
                <mat-spinner diameter="20"/>
            } @else {
                <span class="label">
                    <mat-icon>save</mat-icon>
                    <ng-container i18n>Enregistrer</ng-container>
                    @if (store.dirty()) {
                        <span class="dirty-dot" i18n-matTooltip matTooltip="Modifications non enregistrées"></span>
                    }
                </span>
            }
        </button>
    </div>
</div>

<mat-menu #plan_menu="matMenu">
    <button mat-menu-item type="button" data-action="rename" (click)="rename()">
        <mat-icon>edit</mat-icon>
        <span i18n>Renommer</span>
    </button>
    <button mat-menu-item type="button" data-action="duplicate" (click)="duplicate()">
        <mat-icon>content_copy</mat-icon>
        <span i18n>Dupliquer</span>
    </button>
    <button mat-menu-item type="button" data-action="effective" [disabled]="store.selected_plan()?.isEffective === true" (click)="store.setEffective()">
        <mat-icon>star</mat-icon>
        <span i18n>Rendre effective pour ce jour</span>
    </button>
    <button mat-menu-item type="button" data-action="delete" (click)="remove()">
        <mat-icon>delete</mat-icon>
        <span i18n>Supprimer</span>
    </button>
</mat-menu>
