@if (citizen_info) {
    <div class="mho-citizens-daily-actions">
        <table mat-table [dataSource]="datasource" matSort>
            @for (column of columns; track column.id) {
                <ng-container [matColumnDef]="column.id" [sticky]="column.sticky || false">
                    <th mat-header-cell *matHeaderCellDef [class]="column.class || ''">
                        {{ column.header }}
                    </th>

                    <td mat-cell *matCellDef="let row" [class]="`${column.id} ${column.class || ''}`">
                        @switch (column.id) {
                            @case ('avatar_name') {
                                <mho-avatar [src]="row.avatar"></mho-avatar>
                                <div>{{ row.name }}</div>
                            }
                            @default {
                                <div class="band">
                                    @for (action of daily_action_keys; track action.key) {
                                        <mho-compact-toggle
                                            (valueChange)="saveDailyAction(row, action.key, $event, +column.id)"
                                            [disabled]="is_readonly()"
                                            [icon]="action.value.img"
                                            [label]="action.getLabel()"
                                            [value]="isDailyActionDone(row, action.key, +column.id)">
                                        </mho-compact-toggle>
                                    }
                                </div>
                            }
                        }
                    </td>
                </ng-container>
            }
            <tr mat-header-row *matHeaderRowDef="columns | ids; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: columns | ids;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="'100%'">
                    <ng-container i18n>La liste est vide</ng-container>
                </td>
            </tr>
        </table>
    </div>
}
